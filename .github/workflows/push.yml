name: inkdesk push

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: inkdesk
  cancel-in-progress: false

env:
  FONT_URL: https://github.com/lxgw/LxgwWenkaiGB-Lite/releases/download/v1.522/LXGWWenKaiGBLite-Regular.ttf

jobs:
  render-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache font
        id: font-cache
        uses: actions/cache@v6
        with:
          path: fonts
          key: font-lxgw-wenkai-gb-lite-v1.522

      - name: Download font
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          curl -fsSL --retry 3 -o fonts/cjk.ttf "$FONT_URL"
          ls -lh fonts/

      - name: Render and push
        env:
          DEVICE_ID: ${{ secrets.DEVICE_ID }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
        run: python inkdesk_cloud.py --push

      - name: Commit topics.json
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain topics.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add topics.json
            git commit -m "topics: $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push || (git pull --rebase && git push)
          else
            echo "topics.json unchanged, nothing to commit"
          fi

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inkdesk-preview
          path: inkdesk.png
          retention-days: 3
          if-no-files-found: ignore
