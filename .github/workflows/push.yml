name: inkdesk push

on:
  schedule:
    - cron: "0 * * * *"
    # 英语晨卡（2026-09-26）：北京 5:37 / 6:07 / 6:37 各排一次。GitHub 定时常晚跑，整点最堵，所以错开分钟、多排两次
    - cron: "37 21 * * *"
    - cron: "7 22 * * *"
    - cron: "37 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=按时间（北京 5–11 点推英语晨卡，其余推新闻屏）/ english / news"
        default: auto

concurrency:
  group: inkdesk
  cancel-in-progress: false

env:
  FONT_URL: https://github.com/lxgw/LxgwWenkaiGB-Lite/releases/download/v1.522/LXGWWenKaiGBLite-Regular.ttf

jobs:
  render-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache font
        id: font-cache
        uses: actions/cache@v6
        with:
          path: fonts
          key: font-lxgw-wenkai-gb-lite-v1.522

      - name: Download font
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          curl -fsSL --retry 3 -o fonts/cjk.ttf "$FONT_URL"
          ls -lh fonts/

      - name: Render and push
        env:
          DEVICE_ID: ${{ secrets.DEVICE_ID }}
          QWEN_KEY: ${{ secrets.QWEN_KEY }}
          # 2026-08-25 加：有这个就走 DeepSeek 官网（缓存价便宜 30 倍），没有则回落百炼
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          H=$(TZ=Asia/Shanghai date +%-H)
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          if [ "$MODE" = "english" ] || { [ "$MODE" = "auto" ] && [ "$H" -ge 5 ] && [ "$H" -lt 11 ] && [ -f english/card.bmp ]; }; then
            python inkdesk_cloud.py            # 早上照常算 topics（给 Kindle），但不推新闻屏
            python english_card.py --push      # 推英语晨卡
          else
            python inkdesk_cloud.py --push
          fi

      - name: Commit topics.json
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain topics.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add topics.json
            git commit -m "topics: $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push || (git pull --rebase && git push)
          else
            echo "topics.json unchanged, nothing to commit"
          fi

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inkdesk-preview
          path: inkdesk.png
          retention-days: 3
          if-no-files-found: ignore
